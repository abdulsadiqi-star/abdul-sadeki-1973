# Local development + single-host deployment.
#
#   docker compose up -d                       # infrastructure only (postgres, redis, minio, mailpit)
#   docker compose --profile app up -d --build # + migrations + web + worker in containers
#
# Secrets come from .env (create it with `pnpm setup:env`); nothing sensitive is hard-coded here.
name: tamashagah

x-app-env: &app-env
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://tamashagah:${POSTGRES_PASSWORD:?run "pnpm setup:env" first}@postgres:5432/tamashagah
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:?run "pnpm setup:env" first}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-tamashagah}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run "pnpm setup:env" first}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run "pnpm setup:env" first}
  S3_FORCE_PATH_STYLE: "true"
  MAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: ${MAIL_FROM:-تماشاگاه <no-reply@localhost>}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamashagah
      POSTGRES_DB: tamashagah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run "pnpm setup:env" first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamashagah -d tamashagah"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run "pnpm setup:env" first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run "pnpm setup:env" first}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once (no anonymous access).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run "pnpm setup:env" first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run "pnpm setup:env" first}
      S3_BUCKET: ${S3_BUCKET:-tamashagah}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

  # Catches every e-mail the app sends (UI on http://localhost:8025) — verification and reset links.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ------------------------------ application (profile "app") ------------------------------
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://tamashagah:${POSTGRES_PASSWORD:?run "pnpm setup:env" first}@postgres:5432/tamashagah
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    profiles: ["app"]
    build:
      context: .
      target: web
    restart: unless-stopped
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    profiles: ["app"]
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Transcoding needs scratch space; mount a fast disk in production.
    tmpfs:
      - /tmp:size=4g

volumes:
  pgdata:
  redisdata:
  miniodata:
