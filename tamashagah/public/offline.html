<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>اتصال برقرار نیست | تماشاگاه</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafc; --fg: #1d1b26; --muted: #6b6879; --primary: #5b21d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17161d; --fg: #f1f0f6; --muted: #a9a6b8; --primary: #a78bfa; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, "Vazirmatn", Tahoma, sans-serif; text-align: center; }
      main { max-width: 26rem; }
      .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; background: linear-gradient(135deg, #5b21d6, #c4309e); display: grid; place-items: center; }
      .mark svg { width: 36px; height: 36px; fill: #fff; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 20px; line-height: 2; color: var(--muted); }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 10px 28px; background: var(--primary); color: #fff; }
      button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5.6c0-1.1 1.2-1.8 2.2-1.2l9 5.9c.9.6.9 1.8 0 2.4l-9 5.9c-1 .6-2.2-.1-2.2-1.2V5.6Z" /></svg>
      </div>
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>تماشاگاه برای نمایش ویدیوها به اینترنت نیاز دارد. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
