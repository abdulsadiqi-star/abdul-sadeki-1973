# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# --------------------------------------------------------------------------
# Central place to rename the app for a rebrand. This value is wired into
# app/build.gradle.kts as a generated string resource (R.string.app_name)
# and into the Kotlin BuildConfig, so changing it here is enough to rename
# the app everywhere (launcher label, splash screen, in-app references).
# --------------------------------------------------------------------------
APP_DISPLAY_NAME=CalorieMe
