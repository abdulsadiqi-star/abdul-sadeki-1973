# اجرای تست‌های سرور و انتشار نسخه نمایشی فروشگاه (پوشه shop/public) روی GitHub Pages.
# فقط از شاخه پیش‌فرض مخزن منتشر می‌شود؛ قبل از اولین اجرا در
# Settings → Pages → Build and deployment گزینه Source را روی «GitHub Actions» بگذارید.
name: Shop demo on GitHub Pages

on:
  push:
    paths:
      - 'shop/**'
      - '.github/workflows/shop-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: shop-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run server tests
        working-directory: shop
        run: npm test

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shop/public
      - id: deployment
        uses: actions/deploy-pages@v4
