name: tamashagah-ci

on:
  push:
    branches: [main, "claude/**"]
    paths: ["tamashagah/**", ".github/workflows/tamashagah-ci.yml"]
  pull_request:
    paths: ["tamashagah/**", ".github/workflows/tamashagah-ci.yml"]

concurrency:
  group: tamashagah-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tamashagah

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · typecheck · unit · component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tamashagah/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tamashagah/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:components

  integration:
    name: Integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tamashagah_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/tamashagah_test
      DATABASE_URL_TEST: postgresql://ci:ci-only-password@localhost:5432/tamashagah_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (worker/pipeline tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tamashagah/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tamashagah/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: End-to-end (Playwright, desktop + mobile)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tamashagah
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/tamashagah
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3100
      ALLOW_INSECURE_HTTP: "true"
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: .data/storage
      MAIL_TRANSPORT: file
      MAIL_FILE_DIR: .data/mailbox
      E2E_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tamashagah/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tamashagah/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Generate a random session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - name: Start web app and worker
        run: |
          mkdir -p .data
          PORT=3100 nohup pnpm start > .data/web.log 2>&1 &
          if [ -f worker/index.ts ]; then pnpm build:worker && nohup pnpm start:worker > .data/worker.log 2>&1 & fi
          for i in $(seq 1 60); do curl -fs http://localhost:3100/api/health && break; sleep 1; done
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tamashagah/playwright-report
            tamashagah/test-results
            tamashagah/.data/*.log
          if-no-files-found: ignore

  docker:
    name: Docker images build
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    strategy:
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: tamashagah
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
